# =========================================================================
#  KONFIGURACJA LOKOMOTYWY-BUDZIKA
# =========================================================================
#  Ten plik lezy w repozytorium na GitHubie. Lokomotywa sprawdza go co
#  godzine i sama sie do niego dostosowuje — nie trzeba niczego kompilowac
#  ani byc w tej samej sieci co budzik.
#
#  WAZNE: po KAZDEJ zmianie w tym pliku podnies numer w linii "cfg=" o 1.
#  Bez tego lokomotywa uzna, ze nic sie nie zmienilo.
#
#  Linie zaczynajace sie od # sa komentarzami i nie robia nic.
# =========================================================================

# Numer wersji konfiguracji — PODNOS PRZY KAZDEJ ZMIANIE
cfg=2

# --- Program (firmware) -------------------------------------------------
# fw    = numer wersji programu lezacego w repo
# fwurl = adres pliku .bin
# Jesli fw jest wieksze niz wersja wgrana w lokomotywie, sama sie zaktualizuje.
# Dopoki nie zmieniasz programu, zostaw fw rowne wersji, ktora jest na plytce.
fw=5
fwurl=https://raw.githubusercontent.com/bartek-bot-droid/Lokomotywa/main/kod_V4_BUDZIK.ino.bin

# --- Glosnosc 0-100 -----------------------------------------------------
# Dziala tylko przy podniesieniu cfg=. Na co dzien wygodniej zmieniac
# glosnosc suwakiem w panelu http://budzik.local
vol=60

# =========================================================================
#  ZADANIA
#  task=<1. linia na ekranie>|<2. linia>|<krotka nazwa>|<plik mp3>|<pon-pt>|<weekend>
#
#  Ekran ma 20 znakow w linii i nie ma polskich ogonkow — pisz ZEBY, nie ZĘBY.
#  Kolejnosc linii = kolejnosc zadan. Zeby wylaczyc zadanie, zakomentuj je (#).
# =========================================================================
task=PORA NA|WITAMINKI|WITAMINKI|/wit_1.mp3|18:30|19:00
task=SPRZATAMY|ZABAWKI TOSI|ZABAWKI|/zabawki_tosia.mp3|19:00|19:30
task=MYJEMY|ZEBY|ZEBY|/zeby.mp3|19:15|19:45
task=SZYKUJEMY SIE|DO KAPIELI|KAPIEL|/kapanie.mp3|19:30|20:00
task=DRUGIE|WITAMINKI|WITAMINKI 2|/wit_2.mp3|20:00|20:30
task=SZYKUJEMY SIE|DO SPANIA|SPANIE|/spanie.mp3|20:30|21:00

# =========================================================================
#  ZAPOWIEDZI GODZIN
#  clip=<godzina>|<plik mp3>
#  Lokomotywa mowi godzine tylko wtedy, gdy ma nagranie na dana pore.
#  Jesli po drzemce zadanie wypadnie np. o 20:45, powie sam komunikat zadania.
# =========================================================================
clip=18:30|/godz_18_30.mp3
clip=19:00|/godz_19_00.mp3
clip=19:15|/godz_19_15.mp3
clip=19:30|/godz_19_30.mp3
clip=19:45|/godz_19_45.mp3
clip=20:00|/godz_20_00.mp3
clip=20:30|/godz_20_30.mp3
clip=21:00|/godz_21_00.mp3

# =========================================================================
#  NAGRANIA DO POBRANIA
#  file=<sciezka na plytce>|<adres w internecie>|<rozmiar w bajtach>
#
#  Lokomotywa pobiera plik tylko wtedy, gdy go nie ma albo gdy ma inny
#  rozmiar niz podany. Dzieki temu podmiana nagrania dziala tak:
#  wrzucasz nowy plik do repo, wpisujesz tu jego nowy rozmiar, podnosisz cfg=.
#
#  Rozmiar 0 = "pobierz tylko jesli pliku w ogole nie ma".
#  Rozmiar w bajtach pokazuje Windows we wlasciwosciach pliku
#  (bierz liczbe z "Rozmiar", nie z "Rozmiar na dysku").
# =========================================================================
file=/godz_18_30.mp3|https://raw.githubusercontent.com/bartek-bot-droid/Lokomotywa/main/data/godz_18_30.mp3|66385
file=/godz_19_00.mp3|https://raw.githubusercontent.com/bartek-bot-droid/Lokomotywa/main/data/godz_19_00.mp3|56772
